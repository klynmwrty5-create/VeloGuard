name: Build VeloGuard APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          ZIP_FILE=$(ls -t VeloGuard-APK-Project*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE"
            unzip -o "$ZIP_FILE" -x ".github/*"
          fi
          if [ -f "app/src/main/java/com/tunweb/wireguard/OpenVpnBackend.kt" ]; then
            sed -i 's/logItem\.mMessage/logItem.toString()/g' app/src/main/java/com/tunweb/wireguard/OpenVpnBackend.kt
          fi
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = 34/compileSdk = 35/g' app/build.gradle.kts
          fi

      - name: Download hev-socks5-tunnel AAR, ics-openvpn AAR & Aether + Psiphon Android Cores
        run: |
          set -e
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a tmp_cores

          curl -fSL "https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel.aar" -o app/libs/hev-socks5-tunnel.aar
          echo "ae8a2e96b80b4eccccd037805a4bb4a278090c89dbcae8bc6fcb7634e9a255b9  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -
          hev_list=$(unzip -l app/libs/hev-socks5-tunnel.aar)
          grep -q "classes.jar" <<<"$hev_list"

          curl -fSL "https://github.com/mysteriumnetwork/openvpn_dart/raw/refs/heads/master/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar" -o app/libs/icsopenvpn.aar \
            || curl -fSL "https://raw.githubusercontent.com/mysteriumnetwork/openvpn_dart/master/android/localmaven/network/mysterium/openvpn/icsopenvpn/0.7.55-myst/icsopenvpn-0.7.55-myst.aar" -o app/libs/icsopenvpn.aar
          echo "3540c8579b0056baac517cb6c930d9d9fb19cbbdf6216e4353fce5513aee50f6  app/libs/icsopenvpn.aar" | sha256sum -c -
          ovpn_list=$(unzip -l app/libs/icsopenvpn.aar)
          grep -q "classes.jar" <<<"$ovpn_list"

          curl -fSL "https://github.com/CluvexStudio/Aether/releases/download/v2.4.0/aether-android-arm64.tar.gz" -o tmp_cores/arm64.tar.gz
          echo "02f1a1d673cf2f3e5592c90ce7ef4d6f03e218d41a333bdd175e0da92ce2073c  tmp_cores/arm64.tar.gz" | sha256sum -c -

          curl -fSL "https://github.com/CluvexStudio/Aether/releases/download/v2.4.0/aether-android-armv7.tar.gz" -o tmp_cores/armv7.tar.gz
          echo "13a170d175eab5a64d69c6fa3c174430754f01171d616a00eba0b3598315da1d  tmp_cores/armv7.tar.gz" | sha256sum -c -

          extract_aether() {
            archive="$1"
            abi="$2"
            mkdir -p "tmp_cores/$abi"
            tar -xzf "$archive" -C "tmp_cores/$abi"
            bin_path=$(find "tmp_cores/$abi" -type f -name "aether" | head -n 1)
            if [ -z "$bin_path" ]; then
              echo "Could not find aether binary in $archive"
              exit 1
            fi
            cp "$bin_path" "app/src/main/jniLibs/$abi/libaether.so"
            chmod 0755 "app/src/main/jniLibs/$abi/libaether.so"

            psi_path=$(find "tmp_cores/$abi" -type f \( -name "psiphon-tunnel-core" -o -name "psiphon" \) | head -n 1)
            if [ -z "$psi_path" ]; then
              echo "Could not find psiphon-tunnel-core binary in $archive"
              exit 1
            fi
            cp "$psi_path" "app/src/main/jniLibs/$abi/libpsiphon.so"
            chmod 0755 "app/src/main/jniLibs/$abi/libpsiphon.so"
          }

          extract_aether tmp_cores/arm64.tar.gz arm64-v8a
          extract_aether tmp_cores/armv7.tar.gz armeabi-v7a
          rm -rf tmp_cores

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.jks -alias novaguard \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass novaguard123 -keypass novaguard123 \
            -dname "CN=VeloGuard, OU=App, O=VeloGuard, L=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Universal Release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: novaguard123
          RELEASE_KEY_ALIAS: novaguard
          RELEASE_KEY_PASSWORD: novaguard123
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: VeloGuard-Universal-APK
          path: app/build/outputs/apk/release/app-release.apk
